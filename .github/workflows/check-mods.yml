name: Controllo lista mod

on:
  push:
    paths:
      - "mods/**.yml"
      - "scripts/**.py"
      - ".github/workflows/**.yml"
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installa PyYAML
        run: pip install pyyaml
      - name: Controlla la lista
        run: python3 scripts/check_mods.py
