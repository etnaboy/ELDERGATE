# ── Il server ─────────────────────────────────────────────────────
server_note: |
  Requisiti minimi indicativi per 3 giocatori con ~230 mod:
  - RAM server: 8-10 GB (con Distant Horizons lato client, il server respira meglio)
  - RAM client: 8 GB dedicati (Embeddium + Ferrite Core aiutano)
  - La world border resta ARCHIVIATA: nessun pregen forzato, si genera camminando.
